<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>{{ title }}</h1>
            <p>{{ subtitle }}</p>
        </header>

        <section class="card">
            <h2>Giới thiệu</h2>
            <p>{{ description }}</p>
            <div class="links">
                <a href="/api/info" class="btn" target="_blank">Xem API JSON (GET)</a>
                <a href="/docs" class="btn btn-secondary" target="_blank">FastAPI Swagger UI</a>
            </div>
        </section>

        <section class="card">
            <h2>Danh sách tính năng hỗ trợ</h2>
            <ul class="feature-list">
                {% for feature in features %}
                <li class="feature-item">
                    <strong>{{ feature.name }}</strong>
                    <p>{{ feature.description }}</p>
                </li>
                {% endfor %}
            </ul>
        </section>
    </div>

    <footer>
        <p>Ứng dụng FastAPI cơ bản &copy; 2026</p>
    </footer>
</body>
</html>
